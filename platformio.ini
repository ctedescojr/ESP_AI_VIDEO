; ============================================================
; platformio.ini — ESP32 Real-Time Video Blackout Monitor
; ============================================================

[platformio]
extra_configs = credentials.ini

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = default.csv

build_flags =
    -std=gnu++17
    '-D WIFI_SSID="${wifi.ssid}"'
    '-D WIFI_PASS="${wifi.password}"'
    '-D AP_SSID="${ap.ssid}"'
    '-D AP_PASS="${ap.password}"'
