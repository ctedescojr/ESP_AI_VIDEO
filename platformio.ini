; ============================================================
; platformio.ini — ESP32-CAM Real-Time Video Blackout Monitor
; ============================================================

[platformio]
extra_configs = credentials.ini

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = default.csv

build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    '-D WIFI_SSID="${wifi.ssid}"'
    '-D WIFI_PASS="${wifi.password}"'
    '-D AP_SSID="${ap.ssid}"'
    '-D AP_PASS="${ap.password}"'
